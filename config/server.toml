[network]
bind = "0.0.0.0"
port = 25565
motd = "CyaneServer 1.12.2"
online_mode = false

[server]
max_players = 20
view_distance = 8
tick_rate = 20
# survival | creative | spectator
game_mode = "creative"
# 0 = 物理核数 - 1
worker_threads = 0
world_dir = "world"
# 世界存档自动保存间隔（秒；0 = 关闭；停机时总是保存）
autosave_interval = 300
# 玩家数据目录（对齐原版布局 <world>/playerdata/<uuid>；格式暂为 JSON，.dat NBT 兼容待做）
player_data_dir = "world/playerdata"
# OP 名单（UUID → 等级 1-4）
op_file = "config/ops.json"
# 合成配方（数据驱动）
recipe_file = "config/recipes.toml"

[log]
level = "debug"
file = "logs/latest.log"
